[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bsca-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyodbc>=5.0",
    "openpyxl>=3.1",
    "requests>=2.32",
]

[tool.setuptools.packages.find]
include = ["monthly_schedule*"]
